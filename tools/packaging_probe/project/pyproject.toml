[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.13,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhermit-build-probe"
version = "0.1.1"
description = "Non-runtime optional Rust build behavior probe"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
