[build-system]
requires = [
  "setuptools==83.0.0",
  "setuptools-rust==1.13.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyHermiT"
dynamic = ["version"]
description = "Java-free OWL 2 DL reasoning with pure-Python and optional Rust backends"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "NOTICE.md"]
authors = [
  { name = "pyHermiT contributors" },
]
keywords = ["OWL", "OWL2", "ontology", "reasoner", "semantic-web"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pyowl-core>=0.1,<0.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.100,<7",
  "import-linter>=2.1,<3",
  "mypy>=1.10,<3",
  "packaging>=24,<27",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "tomli>=2.0,<3; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/OAEI-ML/pyHermiT"
Specifications = "https://github.com/OAEI-ML/pyHermiT/tree/main/specs"

[tool.pyhermit]
distribution_normalized_name = "pyhermit"
reference_manifest = "tools/specs/reference.toml"
license_gate_manifest = "tools/specs/licensing.toml"
dependency_manifest = "tools/specs/dependencies.toml"
rust_production_license_manifest = "tools/specs/rust-production-licenses.toml"
index_name_record = "tools/specs/index-names.toml"
native_target_manifest = "tools/specs/native-wheel-targets.toml"
packaging_probe_native_manifest = "tools/packaging_probe/project/native/Cargo.toml"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyhermit = ["_native.pyi", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "pyhermit._version.__version__" }

[tool.cibuildwheel]
build = "cp310-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_i686"]
build-frontend = "build"
environment = { PYHERMIT_BUILD_NATIVE = "1", CARGO_TERM_COLOR = "always", SOURCE_DATE_EPOCH = "946684800" }
audit-requires = ["abi3audit==0.0.26"]
audit-command = "abi3audit --strict --report {abi3_wheel}"
test-requires = [
  "hypothesis>=6.100,<7",
  "packaging>=24,<27",
  "pytest>=8.2,<10",
  "tomli>=2.0,<3; python_version < '3.11'",
]
test-command = [
  "python {project}/tests/packaging/installed_smoke.py --expected-backend native",
  "python {project}/tests/packaging/run_installed_suite.py --backend native",
  "python {project}/tests/packaging/installed_smoke.py --expected-backend python",
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
before-all = """
set -eu
rustup_version=1.28.2
rust_toolchain=1.97.1
rustup_libc=gnu
if ldd --version 2>&1 | grep -qi musl; then
  rustup_libc=musl
fi
case "$(uname -m)-$rustup_libc" in
  x86_64-gnu)
    rustup_host=x86_64-unknown-linux-gnu
    rustup_sha256=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
    ;;
  aarch64-gnu)
    rustup_host=aarch64-unknown-linux-gnu
    rustup_sha256=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
    ;;
  x86_64-musl)
    rustup_host=x86_64-unknown-linux-musl
    rustup_sha256=e6599a1c7be58a2d8eaca66a80e0dc006d87bbcf780a58b7343d6e14c1605cb2
    ;;
  aarch64-musl)
    rustup_host=aarch64-unknown-linux-musl
    rustup_sha256=a97c8f56d7462908695348dd8c71ea6740c138ce303715793a690503a94fc9a9
    ;;
  *)
    echo "unsupported rustup host: $(uname -m)-$rustup_libc" >&2
    exit 1
    ;;
esac
rustup_directory="$(mktemp -d)"
rustup_installer="$rustup_directory/rustup-init"
curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
  --output "$rustup_installer" \
  "https://static.rust-lang.org/rustup/archive/$rustup_version/$rustup_host/rustup-init"
printf '%s  %s\n' "$rustup_sha256" "$rustup_installer" | sha256sum -c -
chmod 0755 "$rustup_installer"
"$rustup_installer" -y --default-toolchain "$rust_toolchain" --profile minimal --no-modify-path
"""
environment = { PYHERMIT_BUILD_NATIVE = "1", CARGO_TERM_COLOR = "always", PATH = "$HOME/.cargo/bin:$PATH", SOURCE_DATE_EPOCH = "946684800" }

[tool.cibuildwheel.macos]
environment = { PYHERMIT_BUILD_NATIVE = "1", CARGO_TERM_COLOR = "always", MACOSX_DEPLOYMENT_TARGET = "10.12", SOURCE_DATE_EPOCH = "946684800" }

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = [
  "tools/specs/tests",
  "tools/packaging_probe/tests",
  "tests/packaging",
  "tests/unit",
  "tests/conformance",
  "tests/differential",
  "tests/integration",
  "tests/native",
  "tests/parity",
  "tests/release",
]
xfail_strict = true
markers = [
  "packaging: build and installed-artifact checks",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tools"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pyhermit", "tools"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tools/specs", "tools/packaging_probe", "tools/reference"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["tools/packaging_probe/project"]

[[tool.mypy.overrides]]
module = ["pyowl_core", "pyowl_core.*"]
warn_unreachable = false

[tool.importlinter]
root_package = "pyhermit"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "runtime-no-build-test-tools"
name = "Runtime package does not import build or test tooling"
type = "forbidden"
source_modules = ["pyhermit"]
forbidden_modules = [
  "build",
  "mypy",
  "pytest",
  "setuptools",
  "setuptools_rust",
]

[[tool.importlinter.contracts]]
id = "runtime-no-project-tools"
name = "Runtime package does not import project tools"
type = "forbidden"
source_modules = ["pyhermit"]
forbidden_modules = ["tools"]
