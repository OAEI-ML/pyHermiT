[build-system]
requires = [
  "setuptools>=77",
  "setuptools-rust>=1.13,<2",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyHermiT"
version = "0.1.0.dev0"
description = "Java-free OWL 2 DL reasoning with pure-Python and optional Rust backends"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "NOTICE.md"]
authors = [
  { name = "pyHermiT contributors" },
]
keywords = ["OWL", "OWL2", "ontology", "reasoner", "semantic-web"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pyowl-core>=0.1,<0.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.100,<7",
  "import-linter>=2.1,<3",
  "mypy>=1.10,<3",
  "packaging>=24,<27",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "tomli>=2.0,<3; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/OAEI-ML/pyHermiT"
Specifications = "https://github.com/OAEI-ML/pyHermiT/tree/main/specs"

[tool.pyhermit]
distribution_normalized_name = "pyhermit"
reference_manifest = "tools/specs/reference.toml"
license_gate_manifest = "tools/specs/licensing.toml"
dependency_manifest = "tools/specs/dependencies.toml"
index_name_record = "tools/specs/index-names.toml"
native_target_manifest = "tools/specs/native-wheel-targets.toml"
packaging_probe_native_manifest = "tools/packaging_probe/project/native/Cargo.toml"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyhermit = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = [
  "tools/specs/tests",
  "tools/packaging_probe/tests",
  "tests/conformance",
  "tests/parity",
]
xfail_strict = true
markers = [
  "packaging: build and installed-artifact checks",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tools"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pyhermit", "tools"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tools/specs", "tools/packaging_probe", "tools/reference"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["tools/packaging_probe/project"]

[tool.importlinter]
root_package = "pyhermit"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "runtime-no-build-test-tools"
name = "Runtime package does not import build or test tooling"
type = "forbidden"
source_modules = ["pyhermit"]
forbidden_modules = [
  "build",
  "mypy",
  "pytest",
  "setuptools",
  "setuptools_rust",
]

[[tool.importlinter.contracts]]
id = "runtime-no-project-tools"
name = "Runtime package does not import project tools"
type = "forbidden"
source_modules = ["pyhermit"]
forbidden_modules = ["tools"]
