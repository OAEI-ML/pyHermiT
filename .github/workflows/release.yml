name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the complete staged set to PyPI (select the matching version tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  distribution-matrix:
    uses: ./.github/workflows/wheels.yml

  licensing-gate:
    name: Verify release authorization
    needs: distribution-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install checksum-pinned release verifier dependency
        run: >-
          python -m pip install --force-reinstall --no-deps --only-binary=:all:
          --require-hashes -r tools/specs/release-verifier-requirements.txt
      - name: Require completed licensing and provenance review
        run: python -m tools.specs.check_release_gate --require-publishable

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: artifacts

      - name: Verify the staged release manifest and every artifact again
        run: >-
          python -m tools.packaging_probe.release_manifest
          --bundle artifacts --source-revision "${GITHUB_SHA}"
          --source-date-epoch 946684800 --verify

  attest-candidate:
    name: Sigstore/GitHub provenance for the complete candidate
    needs: licensing-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install checksum-pinned release verifier dependency
        run: >-
          python -m pip install --force-reinstall --no-deps --only-binary=:all:
          --require-hashes -r tools/specs/release-verifier-requirements.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: artifacts

      - name: Reverify the exact candidate immediately before attestation
        run: >-
          python -m tools.packaging_probe.release_manifest
          --bundle artifacts --source-revision "${GITHUB_SHA}"
          --source-date-epoch 946684800 --verify

      - name: Attest every staged artifact, manifest, checksum file, and SBOM
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/*

  publish-pypi:
    name: Trusted PyPI publication
    needs: attest-candidate
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pyHermiT
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install checksum-pinned release verifier dependency
        run: >-
          python -m pip install --force-reinstall --no-deps --only-binary=:all:
          --require-hashes -r tools/specs/release-verifier-requirements.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: artifacts

      - name: Reverify the exact candidate and tag immediately before publication
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m tools.packaging_probe.release_manifest \
            --bundle artifacts --source-revision "${GITHUB_SHA}" \
            --source-date-epoch 946684800 --verify
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version_source = Path("src/pyhermit/_version.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', version_source, flags=re.MULTILINE)
          assert match is not None, "runtime version is missing"
          assert os.environ["RELEASE_REF"].startswith("refs/tags/v"), os.environ["RELEASE_REF"]
          assert os.environ["RELEASE_TAG"] == f"v{match.group(1)}", (
              os.environ["RELEASE_TAG"],
              match.group(1),
          )

          artifacts = Path("artifacts")
          distributions = sorted((*artifacts.glob("*.whl"), *artifacts.glob("*.tar.gz")))
          native = [path for path in distributions if "-cp310-abi3-" in path.name]
          pure = [path for path in distributions if path.name.endswith("-py3-none-any.whl")]
          sdist = [path for path in distributions if path.name.endswith(".tar.gz")]
          assert (len(native), len(pure), len(sdist)) == (8, 1, 1), (
              native,
              pure,
              sdist,
          )

          destination = Path("publish")
          destination.mkdir()
          for path in distributions:
              path.rename(destination / path.name)
          PY

      - name: Publish the complete same-version distribution set
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: publish
          skip-existing: false
          verbose: true
