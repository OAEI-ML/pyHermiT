name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install supported runtime, pinned build backend, and development tools
        run: |
          python -m pip install "pyowl-core>=0.1,<0.2" \
            build==1.5.0 "hypothesis>=6.100,<7" "import-linter>=2.1,<3" \
            "mypy>=1.10,<3" "packaging>=24,<27" "pytest>=8.2,<10" \
            "pytest-cov>=5,<8" "ruff>=0.5,<1" setuptools==83.0.0 \
            setuptools-rust==1.13.0 "tomli>=2.0,<3" wheel==0.46.3
          PYHERMIT_BUILD_NATIVE=0 python -m pip install --no-build-isolation -e .

      - name: Test
        run: python -m pytest

      - name: Validate specifications, metadata, dependencies, and blocked release
        run: |
          python -m tools.specs.check_workpackages
          python -m tools.specs.check_project
          python -m tools.specs.check_links
          python -m tools.specs.check_release_gate --assert-blocked

      - name: Lint, types, and imports
        if: matrix.python == '3.12'
        run: |
          ruff format --check .
          ruff check .
          mypy
          lint-imports

  pure-artifacts:
    name: Compiler-free wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build/probe tools
        run: >-
          python -m pip install build==1.5.0 "packaging>=24,<27"
          setuptools==83.0.0 setuptools-rust==1.13.0 wheel==0.46.3

      - name: Build isolated pure artifacts
        env:
          PYHERMIT_BUILD_NATIVE: "0"
          SOURCE_DATE_EPOCH: "946684800"
        run: python -m build

      - name: Inspect no-Java artifacts
        run: |
          python -m tools.packaging_probe.check_artifact --pure dist/*.whl
          python -m tools.packaging_probe.check_artifact dist/*.tar.gz

      - name: Prove optional failure and wheel-tag preference
        run: python -m tools.packaging_probe.run_probe

      - name: Prove publication is unavailable
        run: |
          if python -m tools.specs.check_release_gate --require-publishable; then
            echo "LIC-001 unexpectedly allowed publication"
            exit 1
          fi
